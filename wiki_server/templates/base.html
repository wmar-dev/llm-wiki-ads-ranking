<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}LLM Wiki{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    document.querySelectorAll('code.language-mermaid').forEach(code => {
      const pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = code.textContent;
      code.parentElement.replaceWith(pre);
    });
    mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
  </script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-heading"><a href="/">LLM Wiki</a></div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label">Pages</div>
        <a href="/wiki/synthesis/">Synthesis</a>
        <a href="/wiki/concepts/">Concepts</a>
        <a href="/wiki/entities/">Entities</a>
        <a href="/wiki/sources/">Sources</a>
      </div>
      <div class="nav-section">
        <div class="nav-label">Tools</div>
        <a href="/search">Search</a>
        <a href="/metrics">Metrics</a>
      </div>
    </nav>
  </aside>
  <div class="content-wrapper">
    <form action="/search" method="get" class="top-search">
      <input type="search" name="q" placeholder="Search…" value="{{ request.args.get('q', '') }}">
      <button type="submit">Go</button>
    </form>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.math').forEach(function(el) {
        katex.render(el.textContent, el, { displayMode: el.tagName === 'DIV', throwOnError: false });
      });
    });
  </script>
  <script src="/static/search-suggest.js"></script>
</body>
</html>
